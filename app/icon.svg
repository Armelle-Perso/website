<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#1C1C1C"/>
  <!-- Seed of Life — maximum sharpness for favicon -->
  <style>circle{shape-rendering:geometricPrecision}</style>
  <!-- Central circle -->
  <circle cx="16" cy="16" r="4" fill="none" stroke="#C4A882" stroke-width="2.2" opacity="1"/>
  <!-- 6 petal circles -->
  <circle cx="16" cy="12" r="4" fill="none" stroke="#E8927C" stroke-width="1.8" opacity="0.85"/>
  <circle cx="19.5" cy="14" r="4" fill="none" stroke="#5BC4BF" stroke-width="1.8" opacity="0.85"/>
  <circle cx="19.5" cy="18" r="4" fill="none" stroke="#E8927C" stroke-width="1.8" opacity="0.85"/>
  <circle cx="16" cy="20" r="4" fill="none" stroke="#5BC4BF" stroke-width="1.8" opacity="0.85"/>
  <circle cx="12.5" cy="18" r="4" fill="none" stroke="#E8927C" stroke-width="1.8" opacity="0.85"/>
  <circle cx="12.5" cy="14" r="4" fill="none" stroke="#5BC4BF" stroke-width="1.8" opacity="0.85"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#C4A882"/>
</svg>
